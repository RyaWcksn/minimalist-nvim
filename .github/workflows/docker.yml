name: Build and Push Docker Image

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  NTFY_URL: https://ntfy.arwi.dev/github_alerts

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        run: |
          set -e
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --push \
            --tag "ghcr.io/${{ github.repository }}:${{ github.sha }}" \
            --tag "ghcr.io/${{ github.repository }}:latest" \
            --tag "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}" \
            --file Dockerfile \
            . 2>&1 | tee /tmp/build.log
        env:
          DOCKER_BUILDKIT: 1

      - name: Notify success
        if: success()
        run: |
          for attempt in 1 2 3 4 5; do
            curl -sS \
              --retry 5 \
              --retry-delay 3 \
              --retry-connrefused \
              --max-time 30 \
              -H "Title: Docker Build Passed" \
              -H "Tags: white_check_mark" \
              -H "Priority: high" \
              -d "ghcr.io/${{ github.repository }}:${{ github.sha }}" \
              "$NTFY_URL" && exit 0 || echo "Attempt $attempt failed, retrying..."
            sleep 5
          done

      - name: Notify failure
        if: failure()
        run: |
          ERROR_LOG=$(cat /tmp/build.log 2>/dev/null | tail -50 || echo "No build log available")
          for attempt in 1 2 3 4 5; do
            curl -sS \
              --retry 5 \
              --retry-delay 3 \
              --retry-connrefused \
              --max-time 30 \
              -H "Title: Docker Build Failed" \
              -H "Tags: x\" \\\n              -H \"Priority: urgent" \
              -d "ghcr.io/${{ github.repository }}:${{ github.ref_name }}

Error:
$ERROR_LOG" \
              "$NTFY_URL" && exit 0 || echo "Attempt $attempt failed, retrying..."
            sleep 5
          done
